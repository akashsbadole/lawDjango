{% load static %}
<!-- Alpine.js Search Box Component -->
<div x-data="searchBox" class="search-box {{ search_class|default:'' }}">
    <div class="search-input-wrapper">
        <input 
            type="text" 
            class="form-control {{ input_class|default:'' }}"
            x-model="query"
            @input.debounce.300ms="performSearch"
            @keydown.escape="clearResults"
            placeholder="{{ placeholder|default:'Search...' }}"
            {{ input_attrs|default:'' }}
        >
        <div class="search-icon">
            <i class="fas fa-search" x-show="!loading"></i>
            <i class="fas fa-spinner fa-spin" x-show="loading"></i>
        </div>
        <button 
            class="search-clear" 
            x-show="query.length > 0"
            @click="clearSearch"
            type="button"
        >
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <!-- Search Results Dropdown -->
    <div 
        x-show="results.length > 0 && query.length >= 2" 
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 transform scale-95"
        x-transition:enter-end="opacity-100 transform scale-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 transform scale-100"
        x-transition:leave-end="opacity-0 transform scale-95"
        class="search-results"
        @click.away="clearResults"
    >
        <template x-for="result in results" :key="result.id">
            <a 
                :href="result.url" 
                class="search-result-item"
                @click="selectResult(result)"
            >
                <div class="search-result-content">
                    <div class="search-result-title" x-text="result.title"></div>
                    <div class="search-result-description" x-text="result.description"></div>
                    <div class="search-result-type" x-text="result.type"></div>
                </div>
                <div class="search-result-icon">
                    <i :class="getIconForType(result.type)"></i>
                </div>
            </a>
        </template>
        
        <div x-show="results.length === 0 && query.length >= 2" class="search-no-results">
            <i class="fas fa-search"></i>
            <p>No results found for "<span x-text="query"></span>"</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('searchBox', () => ({
        query: '',
        results: [],
        loading: false,
        
        async performSearch() {
            if (this.query.length < 2) {
                this.results = [];
                return;
            }
            
            this.loading = true;
            try {
                const response = await fetch(`{{ search_url|default:'/api/search/' }}?q=${encodeURIComponent(this.query)}`);
                const data = await response.json();
                this.results = data.results || [];
            } catch (error) {
                console.error('Search failed:', error);
                this.results = [];
            } finally {
                this.loading = false;
            }
        },
        
        clearSearch() {
            this.query = '';
            this.results = [];
        },
        
        clearResults() {
            this.results = [];
        },
        
        selectResult(result) {
            this.clearResults();
            // Navigate to result URL
            window.location.href = result.url;
        },
        
        getIconForType(type) {
            const icons = {
                'client': 'fas fa-user-tie',
                'case': 'fas fa-folder-open',
                'document': 'fas fa-file-alt',
                'invoice': 'fas fa-file-invoice',
                'user': 'fas fa-user',
                'task': 'fas fa-tasks',
                'appointment': 'fas fa-calendar',
                'note': 'fas fa-sticky-note'
            };
            return icons[type] || 'fas fa-file';
        }
    }));
});
</script>

<style>
.search-box {
    position: relative;
}

.search-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.search-input-wrapper input {
    padding-right: 2.5rem;
    padding-left: 2.5rem;
}

.search-icon {
    position: absolute;
    left: 0.75rem;
    color: var(--color-text-muted, #64748b);
    z-index: 2;
}

.search-clear {
    position: absolute;
    right: 0.75rem;
    background: none;
    border: none;
    color: var(--color-text-muted, #64748b);
    cursor: pointer;
    padding: 0.25rem;
    border-radius: var(--radius-sm, 0.375rem);
    transition: all 0.2s ease;
    z-index: 2;
}

.search-clear:hover {
    background-color: var(--color-bg-alt, #f8fafc);
    color: var(--color-text, #1e293b);
}

.search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid var(--color-border, #e2e8f0);
    border-radius: var(--radius-md, 0.75rem);
    box-shadow: var(--shadow-lg, 0 10px 15px -3px rgba(0, 0, 0, 0.1));
    max-height: 400px;
    overflow-y: auto;
    z-index: 1000;
    margin-top: 0.25rem;
}

.search-result-item {
    display: flex;
    align-items: center;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--color-border, #e2e8f0);
    text-decoration: none;
    color: inherit;
    transition: background-color 0.2s ease;
}

.search-result-item:hover,
.search-result-item:focus {
    background-color: var(--color-bg-alt, #f8fafc);
}

.search-result-item:last-child {
    border-bottom: none;
}

.search-result-content {
    flex: 1;
}

.search-result-title {
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: var(--color-text, #1e293b);
}

.search-result-description {
    font-size: 0.875rem;
    color: var(--color-text-muted, #64748b);
    margin-bottom: 0.25rem;
}

.search-result-type {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--color-primary, #1e3a8a);
}

.search-result-icon {
    margin-left: 0.75rem;
    color: var(--color-primary, #1e3a8a);
}

.search-no-results {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--color-text-muted, #64748b);
}

.search-no-results i {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    opacity: 0.5;
}

.search-no-results p {
    margin: 0;
    font-size: 0.875rem;
}

.search-no-results span {
    font-weight: 600;
    color: var(--color-text, #1e293b);
}
</style>
