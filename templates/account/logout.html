{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign Out{% endblock %}

{% block content %}

<style>
  .logout-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f3f4f6;
    padding: 20px;
  }

  .logout-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 18px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
  }

  .logout-icon {
    width: 70px;
    height: 70px;
    margin-bottom: 20px;
    color: #d9534f;
  }

  .logout-card h1 {
    font-size: 28px;
    margin-bottom: 10px;
    color: #333;
  }

  .logout-card p {
    color: #666;
    margin-bottom: 30px;
    font-size: 15px;
  }

  .logout-btn {
    width: 100%;
    background: #d9534f;
    color: #fff;
    border: none;
    padding: 14px 0;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s ease;
  }

  .logout-btn:hover {
    background: #c9302c;
  }

  .cancel-link {
    display: inline-block;
    margin-top: 15px;
    color: #666;
    text-decoration: underline;
    font-size: 14px;
  }

  .cancel-link:hover {
    color: #333;
  }
</style>

<div class="logout-page">
  <div class="logout-card">

    <h1>Sign Out</h1>
    <p>Are you sure you want to sign out?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {{ form|crispy }}

      <button type="submit" class="logout-btn">Yes, Sign Out</button>

      <a href="/" class="cancel-link">Cancel & Go Back</a>
    </form>

  </div>
</div>

{% endblock %}
